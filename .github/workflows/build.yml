name: Build & Release

on:
  push:
    branches: [ "main", "refactor/v2-alpha" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "refactor/v2-alpha" ]
  workflow_dispatch:
    inputs:
      build_label:
        description: "用于区分本次测试包的阶段标签"
        required: false
        default: "UI_ERROR_FIX_ALPHA05"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      BUILD_LABEL: ${{ github.event.inputs.build_label || 'UI_ERROR_FIX_ALPHA05' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        # API 37 is still exposed through the preview SDK channel on the hosted runner.
        # Haze alpha05 needs the API 37 compile platform, while the stable 36.0.0
        # build tools are sufficient to package the app.
        run: sdkmanager --channel=1 "platforms;android-37" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          TAG="v${VERSION_NAME}"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${BUILD_LABEL}" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${TAG}" >&2
            exit 1
          fi

      - name: Validate checked-in update manifest
        run: python3 scripts/validate_update_manifest.py docs/update.json

      - name: Run automated tests and build
        id: checks
        continue-on-error: true
        run: |
          chmod +x gradlew scripts/run_ci_checks.sh scripts/validate_ui_contract.py scripts/validate_update_manifest.py
          CI_BUILD_LABEL="$BUILD_LABEL" scripts/run_ci_checks.sh ci-output

      - name: Locate APK
        id: apk
        if: always()
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found; test report will still be uploaded."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="fxxkHilife-${BUILD_LABEL}-${TAG}-${VERSION_CODE}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Locate debug APK
        id: debug_apk
        if: always()
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No debug APK found."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="fxxkHilife-debug-${BUILD_LABEL}-${TAG}-${VERSION_CODE}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Generate release update manifest
        id: manifest
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.available == 'true'
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          PUBLISHED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          cat > update.json <<JSON
          {
            "schemaVersion": 1,
            "channel": "stable",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "releaseUrl": "https://github.com/ct-yx/fxxkHilife/releases/tag/${TAG}",
            "apkUrl": "https://github.com/ct-yx/fxxkHilife/releases/download/${TAG}/${APK}",
            "sha256": "${SHA256}",
            "publishedAt": "${PUBLISHED_AT}",
            "minSdk": 26,
            "notesUrl": "https://github.com/ct-yx/fxxkHilife/releases/tag/${TAG}",
            "notes": "See the release notes for this version."
          }
          JSON
          python3 scripts/validate_update_manifest.py update.json
          echo "path=update.json" >> "$GITHUB_OUTPUT"

      - name: Upload automated test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-report-${{ env.BUILD_LABEL }}-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.version_code }}
          path: ci-output/
          if-no-files-found: error

      - name: Upload APK artifact
        if: steps.apk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fxxkHilife-${{ env.BUILD_LABEL }}-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload debug APK artifact
        if: steps.debug_apk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fxxkHilife-debug-${{ env.BUILD_LABEL }}-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.debug_apk.outputs.path }}
          if-no-files-found: error

      - name: Upload update manifest artifact
        if: steps.manifest.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.version_code }}
          path: update.json
          if-no-files-found: error

      - name: Fail workflow when automated checks failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.checks.outcome }}" != "success" ]; then
            echo "Automated checks failed. Download the automated-test-report artifact." >&2
            exit 1
          fi

      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag " " { capture=1; print; next }
            capture && $0 ~ "^## " { exit }
            capture { print }
          ' DEVELOPMENT_LOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            {
              echo "## $TAG"
              echo
              git log -1 --pretty=format:%s
              echo
            } > release_notes.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" update.json --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" update.json \
              --title "Release $TAG" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}"
          fi
